name: bookreader

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bookreader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432" # host access for local tooling only; not exposed publicly

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379" # host access for local tooling only; not exposed publicly
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migration:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bookreader}?sslmode=disable",
        "up",
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
    # Also tags local builds with this name, and lets a deploy that never
    # wants to build from source (see docs/deployment.md) do
    # `docker compose pull backend && docker compose up -d backend` instead —
    # CI publishes this same tag on every push to main.
    image: ghcr.io/edwardpendekar/mylibrary-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bookreader}?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a long random JWT_ACCESS_SECRET in .env}
      JWT_ISSUER: bookreader-api
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Strict}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /app/storage/uploads
      STORAGE_LOCAL_PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost}/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-120}
      RATE_LIMIT_AUTH_RPM: ${RATE_LIMIT_AUTH_RPM:-10}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@bookreader.local}
    volumes:
      - uploads_data:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin via nginx: the browser calls /api/... on the page's own
        # origin, so this is intentionally empty rather than a backend URL.
        NEXT_PUBLIC_BACKEND_ORIGIN: ""
        NEXT_PUBLIC_ASSET_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    # See the same note on `backend` above — CI publishes this tag (baked
    # with NEXT_PUBLIC_ASSET_ORIGIN=https://books.rbp01.online) on every push.
    image: ghcr.io/edwardpendekar/mylibrary-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_ORIGIN: http://backend:8080

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
      # - ./infra/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
  uploads_data:
