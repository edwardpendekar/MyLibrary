name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookreader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translate script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Translate script unit tests
        run: python -m unittest discover -s scripts

      - name: Run migrations against test database
        run: |
          go run -tags postgres -mod=mod github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1 \
            -path migration -database "postgres://postgres:postgres@localhost:5432/bookreader_test?sslmode=disable" up
        env:
          MIGRATE_FORCE: "1"

      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bookreader_test?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_ACCESS_SECRET: ci-test-secret

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/api

  backend-integration:
    name: Backend integration tests (testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      # testcontainers-go starts its own throwaway Postgres/Redis containers
      # against the runner's Docker daemon (already present on ubuntu-latest),
      # so this job needs no GH Actions `services:` block, unlike the `backend` job.
      - name: Run integration tests
        run: go test -tags=integration -v -count=1 ./test/integration/...

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - name: Lint
        run: npm run lint

      # tsc alone can't see PageProps/LayoutProps — Next.js's typed-routes
      # feature generates those as ambient types under .next/types/, which
      # only exists after this. Without it, every typed route file fails
      # with "Cannot find name 'PageProps'" despite compiling fine locally,
      # where a prior `next dev`/`next build` already left .next/types/ in place.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8080
          NEXT_PUBLIC_ASSET_ORIGIN: http://localhost:8080

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]
    # Needed to push to GitHub Container Registry below (push:false on PRs
    # keeps them build-only, since GITHUB_TOKEN is read-only in that context
    # anyway).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are built here (CI, plenty of CPU/RAM) and pushed to GHCR so
      # that deploying is a `docker compose pull` on the target server — not
      # a from-source build. The production VPS this deploys to has a single
      # CPU core; building Next.js there directly has previously pegged it
      # hard enough to make the whole box (including unrelated apps sharing
      # it) briefly unreachable.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/edwardpendekar/mylibrary-backend:latest
            ghcr.io/edwardpendekar/mylibrary-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/edwardpendekar/mylibrary-frontend:latest
            ghcr.io/edwardpendekar/mylibrary-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_ORIGIN=
            NEXT_PUBLIC_ASSET_ORIGIN=https://books.rbp01.online

  e2e:
    name: End-to-end (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack via docker compose
        run: |
          cp .env.example .env
          echo "JWT_ACCESS_SECRET=ci-e2e-secret-$(openssl rand -hex 16)" >> .env
          echo "POSTGRES_PASSWORD=ci-e2e-password" >> .env
          echo "PUBLIC_ORIGIN=http://localhost:8090" >> .env
          echo "HTTP_PORT=8090" >> .env
          docker compose up -d --build

      - name: Wait for the stack to become healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/healthz && exit 0
            sleep 2
          done
          echo "Stack did not become healthy in time" >&2
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests against the compose stack
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8090
          E2E_BACKEND_ORIGIN: http://localhost:8090

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
